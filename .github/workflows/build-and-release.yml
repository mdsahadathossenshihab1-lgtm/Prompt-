name: Build & Release Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (leave empty for auto tag)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (leave empty for auto title)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    name: Build & Release PromptFlow AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "${{ secrets.XKIRO_API_KEY }}" ]; then
            echo "XKIRO_API_KEY=${{ secrets.XKIRO_API_KEY }}" >> .env
          fi

      - name: Ensure Google Services Configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -f google-services.json ]; then
              cp google-services.json app/google-services.json
              echo "Copied google-services.json to app/google-services.json"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Asset
        id: prepare_apk
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="PromptFlow-AI.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "APK generated successfully at $APK_DEST ($(du -h $APK_DEST | cut -f1))"
            echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          else
            echo "Error: APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PromptFlow-AI-APK
          path: PromptFlow-AI.apk
          retention-days: 30

      - name: Determine Release Tag & Version
        id: release_info
        run: |
          BUILD_NUM="${{ github.run_number }}"
          TIMESTAMP="$(date +'%Y%m%d-%H%M')"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="PromptFlow AI $TAG"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="PromptFlow AI $TAG"
            fi
          else
            # Create rolling latest release with unique build tag so GitHub Release always updates & appears at top
            TAG="v1.0.0-build${BUILD_NUM}"
            TITLE="PromptFlow AI v1.0.0 (Build #${BUILD_NUM})"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "tag: $TAG, title: $TITLE"

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          files: PromptFlow-AI.apk
          body: |
            ## 🎬 PromptFlow AI — AI Video Master Prompt Generator
            
            ### 📱 Download Android APK
            Download **`PromptFlow-AI.apk`** from the **Assets** section below and install it directly on your Android phone!
            
            - **App Name:** PromptFlow AI
            - **Build:** ${{ steps.release_info.outputs.tag }} (Run #${{ github.run_number }})
            - **Commit:** `${{ github.sha }}`
            
            ---
            
            ### 🚀 Features & Updates:
            - **AI Video Master Prompt Generation**: DeepSeek V4.1 Flash via XKIRO API.
            - **Inbuilt Firebase Cloud Database**: Full CRUD operations + real-time backup and sync on Firestore (`ai-studio-promptflowai-33eaf848-a774-4d54-9ed1-e99f251be592`).
            - **Exact Dialogue Preservation**: Bengali, English, Banglish dialogue without unwanted rewriting.
            - **Character Reference Image**: Upload model image to preserve face, skin tone, hair, and clothing consistency.
            - **Strict 22-Point Cinematography Rules**: Camera angles, lighting, continuous single-voice take, lip-sync, and semantic B-roll cutaway synchronization.
            - **Room Local Database**: Offline caching, history search, copy-to-clipboard, in-line editor, and cloud sync.
            
            ---
            
            ### 📲 How to Install on Android / মোবাইলে ইনস্টল করার নিয়ম:
            1. নিচে দেওয়া **`PromptFlow-AI.apk`** ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলটিতে ক্লিক করুন।
            3. যদি *"Install unknown apps"* বা অনুমতি চায়, ব্রাউজার বা ফাইল ম্যানেজারকে অনুমতি (Allow) দিন।
            4. **Install** বাটনে ট্যাপ করলেই অ্যাপটি ইনস্টল হয়ে যাবে!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
