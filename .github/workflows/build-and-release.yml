name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'PromptFlow AI v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build PromptFlow AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          # If repository secret XKIRO_API_KEY is configured in GitHub repository secrets, inject it
          if [ -n "${{ secrets.XKIRO_API_KEY }}" ]; then
            echo "XKIRO_API_KEY=${{ secrets.XKIRO_API_KEY }}" >> .env
          fi

      - name: Ensure Google Services Configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -f google-services.json ]; then
              cp google-services.json app/google-services.json
              echo "Copied google-services.json to app/google-services.json"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Asset
        id: prepare_apk
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="PromptFlow-AI.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "APK generated successfully at $APK_DEST"
            echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          else
            echo "Error: APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PromptFlow-AI-APK
          path: PromptFlow-AI.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=PromptFlow AI $TAG" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            TAG="${{ inputs.tag_name }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && ("${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master") ]]; then
            # Automatic latest release on push to main or master
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            echo "title=PromptFlow AI v1.0.0 (Latest Release)" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        if: steps.release_info.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          files: PromptFlow-AI.apk
          body: |
            ## 🎬 PromptFlow AI — AI Video Master Prompt Generator

            ### 📱 Download Android APK
            Download **`PromptFlow-AI.apk`** from the **Assets** section below and install it directly on your Android phone!

            ---

            ### 🚀 Features in this Release:
            - **AI Video Master Prompt Generation**: DeepSeek V4.1 Flash integration via XKIRO API for professional video prompts (Google Flow, Sora, Runway, Kling).
            - **Exact Dialogue Preservation**: Supports Bengali, English, Banglish, and mixed languages without unwanted rewriting.
            - **Character Reference Image**: Upload model/presenter photos; ensures 100% facial geometry, clothing, and appearance consistency.
            - **Strict 22-Point Cinematography Rules**: Camera angles, lighting, one continuous voice take, natural lip-sync, and semantic B-roll cutaway synchronization.
            - **Room Local Database + Firebase Cloud Firestore**: Save, view, copy, edit, and back up prompts to the cloud with one tap.
            - **Export & Share**: Direct prompt clipboard copy, editable viewer, and `.txt` file export.

            ---

            ### 📲 How to Install on Android / মোবাইলে ইনস্টল করার নিয়ম:
            1. নিচে দেওয়া **`PromptFlow-AI.apk`** ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলটিতে ক্লিক করুন।
            3. যদি *"Install unknown apps"* বা অনুমতি চায়, ব্রাউজার বা ফাইল ম্যানেজারকে অনুমতি (Allow) দিন।
            4. **Install** বাটনে ট্যাপ করলেই অ্যাপটি আপনার ফোনে ইনস্টল হয়ে যাবে!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
